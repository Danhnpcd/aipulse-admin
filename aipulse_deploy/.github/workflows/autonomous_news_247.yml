name: AI Pulse Cloud 24-7 KeepAlive & Compliance Mode

on:
  schedule:
    # Runs on GitHub Cloud 24/7 to maintain Render Cloud Server uptime
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud-pulse-247:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wake & Verify Unified Cloud Admin Server (Render 24/7 Keep-Alive)
        env:
          CLOUD_SERVER_URL: ${{ vars.CLOUD_SERVER_URL || 'https://aipulse-admin.onrender.com' }}
        run: |
          echo "Heartbeat ping -> ${CLOUD_SERVER_URL}/api/health"
          curl -s -o /dev/null -w "Cloud Admin HTTP: %{http_code}\n" --max-time 45 "${CLOUD_SERVER_URL}/api/health" || true

      - name: Compliance Gate Check (Decree 147/2024/ND-CP)
        run: |
          echo "⚖️ Running Legal Compliance Worker..."
          python3 cloud_news_worker.py
